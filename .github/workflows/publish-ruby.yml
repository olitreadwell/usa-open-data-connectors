name: Publish Ruby gem to RubyGems

on:
  push:
    tags:
      - 'ruby-v*'

jobs:
  publish:
    name: Publish nzdata gem to RubyGems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.4'
      - name: Build gem
        run: cd ruby && gem build nzdata.gemspec
      - name: Push gem
        run: cd ruby && gem push nzdata-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
