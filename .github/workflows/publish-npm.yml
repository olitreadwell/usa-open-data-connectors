name: Publish TypeScript packages to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # `npm stage publish` needs npm 11.15 or later. The Node version in
      # `.nvmrc` ships npm 10, so install npm 11 for this step.
      - run: npm install -g npm@^11.15.0
      # --workspaces fails the whole run as soon as one workspace already has
      # its version on the registry. The unchanged cli and mcp packages sit at
      # 0.1.0, so every sources release died on "cannot publish over 0.1.0"
      # and nothing was staged. Stage only the versions that are new.
      - run: |
          set -euo pipefail
          for dir in packages/*/; do
            if [ ! -f "$dir/package.json" ]; then
              continue
            fi
            if [ "$(node -p "require('./$dir/package.json').private ?? false")" = "true" ]; then
              continue
            fi
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -z "$name" ]; then
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skip $name@$version, already published"
              continue
            fi
            echo "Stage $name@$version"
            npm stage publish "./$dir" --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
