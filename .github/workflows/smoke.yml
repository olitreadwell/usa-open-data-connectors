name: Live smoke tests

# Hits the real US public APIs nightly. Unit tests use fixtures and never
# touch the network; these jobs prove the fixtures have not drifted.
on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke

  python:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - run: uv sync --locked --extra dev
        working-directory: python
      - run: .venv/bin/pytest tests/test_smoke.py
        working-directory: python
        env:
          RUN_SMOKE: "1"

  ruby:
    name: Ruby smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake check
        working-directory: ruby
        env:
          RUN_SMOKE: "1"
